; Hardware tests for an Uno and classic ATmega328P Nano.
[platformio]
default_envs = uno

[env]
platform = atmelavr@5.3.0
framework = arduino
monitor_speed = 115200
lib_deps =
    SerialLedger=symlink://../../../library

[env:uno]
board = uno

[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328

[env:uno_mixed]
extends = env:uno
build_flags = -DSL_MIXED_OUTPUT_TEST

[env:nano_mixed]
extends = env:nano
build_flags = -DSL_MIXED_OUTPUT_TEST

[env:nano_old_mixed]
extends = env:nano_old
build_flags = -DSL_MIXED_OUTPUT_TEST
