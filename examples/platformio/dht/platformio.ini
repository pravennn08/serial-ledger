; Real DHT11 readings. Start with Uno, then use the same sensor on Nano or ESP32.
[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    SerialLedger=symlink://../../../library
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

[env:uno]
platform = atmelavr@5.3.0
board = uno
build_flags = -DSL_DHT_PIN=2

[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328new
build_flags = -DSL_DHT_PIN=2

[env:nano_old]
platform = atmelavr@5.3.0
board = nanoatmega328
build_flags = -DSL_DHT_PIN=2

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
build_flags = -DSL_DHT_PIN=4
