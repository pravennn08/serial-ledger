[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "serial-ledger"
version = "0.1.0b1"
description = "SerialLedger serial capture and spreadsheet export companion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Raven Magbanua", email = "magbanuaraven08@gmail.com"}]
maintainers = [{name = "Raven Magbanua", email = "magbanuaraven08@gmail.com"}]
keywords = ["serial", "arduino", "esp32", "telemetry", "csv", "xlsx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyserial>=3.5,<4", "openpyxl>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/pravennn08/serial-ledger"
Repository = "https://github.com/pravennn08/serial-ledger"
Issues = "https://github.com/pravennn08/serial-ledger/issues"
Documentation = "https://github.com/pravennn08/serial-ledger/blob/main/docs/INSTALLATION.md"
Changelog = "https://github.com/pravennn08/serial-ledger/blob/main/CHANGELOG.md"

[project.scripts]
serial-ledger = "serial_ledger.cli:main"

[dependency-groups]
dev = ["cmake>=3.28,<5", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["desktop/src/serial_ledger"]

[tool.hatch.build.targets.sdist]
include = [
    "desktop/src/serial_ledger", "README.md", "pyproject.toml", "LICENSE.md",
    "CHANGELOG.md", "docs/INSTALLATION.md", "docs/PROTOCOL.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
